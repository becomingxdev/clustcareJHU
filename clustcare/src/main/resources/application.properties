spring.application.name=clustcare

# Database Configuration (override with DB_URL, DB_USERNAME, DB_PASSWORD in production)
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/clustcare?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:devdesai}
spring.datasource.password=${DB_PASSWORD:231178}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
# Use 'update' for incremental changes. For CLEAN schema creation (e.g. enum changes), consider 'create' or dropping tables manually.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT (override with JWT_SECRET, JWT_EXPIRATION in production; secret can be hex or Base64)
jwt.secret=${JWT_SECRET:9a4f2c8d3b7a1e6f4c8d3b7a1e6f4c8d3b7a1e6f4c8d3b7a1e6f4c8d3b7a1e6f4c8d3b7a1e6f}
jwt.expiration=${JWT_EXPIRATION:86400000}